# Builds the SCALVS.ai phone app (mobile/, Capacitor) for Android and iOS.
# Runs when a tag like mobile-v1.0.0 is pushed, or by hand from the Actions tab.
#
# Android: always builds an installable debug APK. When the repository has the
#   secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   and ANDROID_KEY_PASSWORD it also builds a signed release APK and a Play Store
#   bundle (.aab).
# iOS: builds the app for the iOS Simulator to prove it compiles. Installing on
#   iPhones or sending to the App Store needs an Apple Developer account; open
#   mobile/ios/App/App.xcodeproj in Xcode on a Mac, pick your team, then
#   Product → Archive.
name: Phone apps

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - name: Signed release build
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SCALVS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCALVS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SCALVS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          export SCALVS_KEYSTORE_FILE="$PWD/release.keystore"
          ./gradlew assembleRelease bundleRelease
      - name: Collect files
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/debug/app-debug.apk ../out/SCALVS.ai-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk ../out/SCALVS.ai.apk; fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab ../out/SCALVS.ai.aab; fi
      - uses: actions/upload-artifact@v4
        with:
          name: scalvs-android
          path: out/*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/SCALVS.ai-simulator.app.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: scalvs-ios-simulator
          path: SCALVS.ai-simulator.app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scalvs-android
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: SCALVS.ai phone app ${{ github.ref_name }}
