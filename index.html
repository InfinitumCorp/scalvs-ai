<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCALVS.ai — AI workforce</title>
  <meta name="description" content="SCALVS.ai by Infinitum: build agents that research, write, code, sell and operate for you.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="sidebar" aria-label="Primary">
    <a class="brand" href="#/command">
      <span class="logo" aria-hidden="true">S</span>
      <span>SCALVS<span class="muted">.ai</span></span>
    </a>
    <a class="new-btn" href="#/command">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New task
    </a>
    <nav class="nav">
      <a href="#/command" data-route="command">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v10H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Command Center <span id="approvals-badge" class="badge" hidden>0</span>
      </a>
      <a href="#/studio" data-route="studio">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Agent Studio
      </a>
      <a href="#/connect" data-route="connect">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Connect
      </a>
      <a href="#/earnings" data-route="earnings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h18M16 14.5h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Earnings
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="account">
        <span class="avatar" aria-hidden="true">IN</span>
        <div><div class="small">Infinitum</div><div class="muted small"><span id="plan-label">Free plan</span> · <span id="sclv-label">0 $SCLV</span></div></div>
      </div>
      <p class="muted tiny">A product of Infinitum Corporation. Prototype.</p>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <div class="shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <span class="brand-sm">SCALVS<span class="muted">.ai</span></span>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
